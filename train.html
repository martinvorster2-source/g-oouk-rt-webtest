<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#090d12" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="format-detection" content="telephone=no" />

<title>Train your AI voice</title>
<style>
:root{color-scheme:dark;--bg:#090d12;--card:#141b22;--text:#f3f6f8;--muted:#9aa6b2;--say:#ffd15a;--ok:#73ffb2;--alert:#ff5d57;font-family:"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;border-radius:16px;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;gap:8px;font-size:13px;color:var(--muted)}
.top b{color:var(--text);font-size:15px}
.top a{color:var(--muted)}
.bar{height:5px;background:#1c2630;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.tag{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:10px 2px 0}
.phrase{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;line-height:1.25;color:var(--say);padding:6px 4px;min-height:0;overflow:hidden}
.phrase span{display:block;max-width:100%;overflow-wrap:anywhere}
.status{min-height:22px;text-align:center;font-size:14px;color:var(--muted);padding:2px 0}
.status.bad{color:var(--alert)}.status.good{color:var(--ok)}
.meter{height:8px;background:#1c2630;border-radius:4px;overflow:hidden;margin:4px 2px 8px;opacity:.25}
.meter.on{opacity:1}.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .06s}
.controls{display:flex;gap:8px;padding-bottom:10px}
.controls button{flex:1;padding:0;height:64px;font-size:19px;background:#24303a}
.controls .big{flex:2;background:var(--say);color:#111;font-size:22px}
.controls .big.rec{background:var(--alert);color:#fff}
.controls .go{background:var(--ok);color:#06210f;flex:2}
.controls button:disabled{opacity:.35}
.hidden{display:none!important}
.start{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
.start h1{margin:0;font-size:30px}.start p{margin:0;color:var(--muted);line-height:1.4}
.start .big{padding:20px;font-size:22px;background:var(--say);color:#111}
.done{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center}
.done h1{margin:0;color:var(--ok)}
</style>
</head>

<div class="top"><span><b id="count">1 / 1</b> · <span id="queue"></span></span><a href="./#">Back to app</a></div>

<section class="start" id="start">
  <h1>Train your AI voice</h1>
  <p>Plug in your headset cable, put the phone where you would normally speak, and read each ATC call out loud in your normal radio voice. About 5 seconds each. Your recordings go only to your private store, never to the public page.</p>
  <button class="big" id="begin" type="button">Start</button>
  <p id="start-note"></p>
</section>

<section id="main" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <div class="tag" id="tag">ATC</div>
  <div class="phrase" id="phrase"><span id="ptext"></span></div>
  <div class="status" id="status"></div>
  <div class="meter" id="meter"><i id="level"></i></div>
  <div class="controls" id="ctl-ready"><button class="big" id="rec" type="button">Record</button><button id="skip" type="button">Skip</button></div>
  <div class="controls hidden" id="ctl-rec"><button class="big rec" id="stop" type="button">Stop</button></div>
  <div class="controls hidden" id="ctl-review"><button id="play" type="button">Play</button><button id="redo" type="button">Redo</button><button class="go" id="next" type="button">Next</button></div>
</section>

    for (const it of await qAllSafe()) {
      const fd = new FormData();
      fd.append("audio", it.blob, it.cid + ".wav");
      fd.append("meta", JSON.stringify(it.meta));
      let r;
      try { r = await fetch(RELAY + "/sample", { method: "POST", headers: { Authorization: "Bearer " + token() }, body: fd }); }
      catch (e) { lastErr = "offline"; break; }
      if (r.ok) { await qDelSafe(it.cid); lastErr = ""; }
      else if (r.status === 429) { lastErr = "Daily limit reached. Carry on tomorrow."; break; }
      else if (r.status === 401 || r.status === 403) { lastErr = "Link not accepted. Open your personal link again."; break; }
      else if (r.status === 413 || r.status === 400) { await qDelSafe(it.cid); lastErr = "A recording was rejected and dropped."; }
      else { lastErr = "Upload error " + r.status + ", will retry."; break; }
    }
  } finally { flushing = false; showQueue(); }
}
async function showQueue(){
  const n = (await qAllSafe()).length;
  $("queue").textContent = n ? (n + " waiting to upload" + (lastErr ? " · " + lastErr : "")) : (lastErr || "all uploaded");
}
setInterval(flush, 15000);
addEventListener("online", flush);
document.addEventListener("visibilitychange", () => { if (!document.hidden) flush(); });

// ---- audio capture (AudioWorklet, context created inside the tap) ----
const WORKLET = `
class Cap extends AudioWorkletProcessor {
  constructor(){ super(); this.on = false; this.port.onmessage = (e) => { this.on = e.data === "start"; }; }
  process(inputs){
    const ch = inputs[0] && inputs[0][0];
    if (ch && this.on) {
      let s = 0; for (let i = 0; i < ch.length; i++) s += ch[i] * ch[i];
      this.port.postMessage({ pcm: ch.slice(0), rms: Math.sqrt(s / ch.length) });
    }
    return true;
  }
}
registerProcessor("cap", Cap);`;

let ctx = null, stream = null, node = null, recording = false, chunks = [], levels = [], tStart = 0, speechAt = -1, lastLoud = 0, floor = 0.004, autoTimer = null;
const SILENCE_MS = 1500, MAX_MS = 30000;

async function ensureAudio(){
  // Must run inside the tap handler on iOS.
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!ctx) ctx = new AC();
  if (ctx.state !== "running") { try { await ctx.resume(); } catch {} }
  if (!stream) {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } });
    stream.getTracks().forEach((t) => t.addEventListener("ended", () => { stream = null; node = null; }));
  }
  if (!node) {
    const url = URL.createObjectURL(new Blob([WORKLET], { type: "application/javascript" }));
    await ctx.audioWorklet.addModule(url);
    URL.revokeObjectURL(url);
    const src = ctx.createMediaStreamSource(stream);
    node = new AudioWorkletNode(ctx, "cap", { numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [1] });
    const mute = ctx.createGain(); mute.gain.value = 0;
    src.connect(node); node.connect(mute); mute.connect(ctx.destination);
    node.port.onmessage = (e) => onBlock(e.data);
  }
}

function onBlock({ pcm, rms }){
  if (!recording) return;
  const now = performance.now();
  chunks.push(pcm); levels.push(rms);
  $("level").style.width = Math.min(100, rms * 600) + "%";
  const n = levels.length;
  if (n <= 12) { floor = Math.max(0.002, Math.min(0.02, (floor * (n - 1) + rms) / n)); return; } // ~ first 30 ms blocks calibrate noise floor
  const thr = Math.max(0.012, floor * 4);
  if (rms > thr) { if (speechAt < 0) speechAt = now; lastLoud = now; }
  if (speechAt >= 0 && now - lastLoud > SILENCE_MS && now - speechAt > 600) stopRec();
  if (now - tStart > MAX_MS) stopRec();
}

function setView(v){
  for (const id of ["ctl-ready", "ctl-rec", "ctl-review"]) $(id).classList.toggle("hidden", id !== "ctl-" + v);
  $("meter").classList.toggle("on", v === "rec");
}
function setStatus(t, cls){ const s = $("status"); s.textContent = t; s.className = "status" + (cls ? " " + cls : ""); }

async function startRec(){
  try { await ensureAudio(); } catch (e) { setStatus("Microphone not available: " + (e && e.name || e) + ". Allow the microphone for this site.", "bad"); return; }
  chunks = []; levels = []; speechAt = -1; lastLoud = 0; floor = 0.004; tStart = performance.now(); recording = true;
  node.port.postMessage("start");
  setView("rec"); setStatus("Listening… read the call, I stop when you pause.");
}
function stopRec(){
  if (!recording) return;
  recording = false; node.port.postMessage("stop");
  const rate = ctx.sampleRate;
  // trim: 0.3 s before first speech, 0.5 s after the last loud block
  const blk = 128;
  const thr = Math.max(0.012, floor * 4);
  let first = levels.findIndex((v, i) => i > 12 && v > thr), last = -1;
  for (let i = levels.length - 1; i >= 0; i--) if (levels[i] > thr) { last = i; break; }
  if (first < 0) { setView("ready"); setStatus("I heard nothing. Check the headset is plugged in and try again.", "bad"); return; }
  const a = Math.max(0, first - Math.round(0.3 * rate / blk)), b = Math.min(levels.length, last + 1 + Math.round(0.5 * rate / blk));
  let total = 0; for (let i = a; i < b; i++) total += chunks[i].length;
  const f32 = new Float32Array(total); let o = 0; for (let i = a; i < b; i++) { f32.set(chunks[i], o); o += chunks[i].length; }
  const pcm16 = floatTo16(resample(f32, rate, 16000));
  const seconds = pcm16.length / 16000;
  let peak = 0; for (let i = 0; i < pcm16.length; i++) peak = Math.max(peak, Math.abs(pcm16[i]));
  take = { blob: wav(pcm16), seconds, peak, url: null };
  if (seconds < 0.8) { setView("ready"); setStatus("Too short. Read the whole call.", "bad"); take = null; return; }
  setView("review");
  if (peak > 32000) setStatus("Too loud, it may be clipping. Redo a little further from the mic.", "bad");
  else if (peak < 1800) setStatus("Very quiet. Redo a bit closer or louder.", "bad");
  else setStatus("Recorded " + seconds.toFixed(1) + " s. Play it back, Redo, or Next.", "good");
}

// windowed-sinc resample to 16 kHz (low-pass at 7.2 kHz)
function resample(x, from, to){
  if (from === to) return x;
  const ratio = from / to, n = Math.floor(x.length / ratio), out = new Float32Array(n);
  const cut = Math.min(1, 1 / ratio) * 0.9, half = 12; // taps on each side, in output-rate zero crossings
  const support = half * Math.max(1, ratio);
  for (let i = 0; i < n; i++) {
    const c = i * ratio; let sum = 0, wsum = 0;
    for (let j = Math.max(0, Math.ceil(c - support)); j <= Math.min(x.length - 1, Math.floor(c + support)); j++) {
      const d = (j - c) / Math.max(1, ratio), t = d * cut * Math.PI;
      const sinc = t === 0 ? 1 : Math.sin(t) / t, w = 0.5 + 0.5 * Math.cos(Math.PI * (j - c) / support);
      const k = sinc * w; sum += x[j] * k; wsum += k;
    }
    out[i] = wsum ? sum / wsum : 0;
  }
  return out;
}
function floatTo16(f){ const o = new Int16Array(f.length); for (let i = 0; i < f.length; i++) { const s = Math.max(-1, Math.min(1, f[i])); o[i] = s < 0 ? s * 32768 : s * 32767; } return o; }
function wav(pcm){
  const b = new ArrayBuffer(44 + pcm.length * 2), v = new DataView(b), w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + pcm.length * 2, true); w(8, "WAVE"); w(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 16000, true); v.setUint32(28, 32000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, pcm.length * 2, true);
  new Int16Array(b, 44).set(pcm); return new Blob([b], { type: "audio/wav" });
}

// ---- phrase flow ----
function fit(){
  const el = $("ptext"), box = $("phrase"); let size = Math.min(44, Math.max(24, innerWidth / 9));
  el.style.fontSize = size + "px";
  while (size > 15 && (el.scrollHeight > box.clientHeight || el.scrollWidth > box.clientWidth)) { size -= 1; el.style.fontSize = size + "px"; }
}
function show(){
  const p = PHRASES[order[idx]];
  $("ptext").textContent = p.text + (p.text.endsWith("?") ? "" : ".");
  $("tag").textContent = p.role === "PILOT" ? "YOU SAY (PILOT)" : "READ AS IF YOU ARE THE CONTROLLER";
  const doneN = Object.keys(st.done).length;
  $("count").textContent = (idx + 1) + " / " + PHRASES.length;
  $("bar").style.width = (100 * doneN / PHRASES.length) + "%";
  take = null; setView("ready"); setStatus(st.done[p.id] ? "Already recorded. Record again to replace it, or Skip." : "Tap Record, then read the call.");
  requestAnimationFrame(fit);
  st.pos = idx; save();
}
function device(){ return (navigator.userAgent.match(/iPhone|iPad|Android|Macintosh|Windows/) || ["other"])[0]; }
async function keep(){
  if (!take) return;
  const p = PHRASES[order[idx]];
  const cid = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
  const meta = { id: p.id, text: p.text, role: p.role, cat: p.cat, cid, ts: new Date().toISOString(), seconds: Math.round(take.seconds * 100) / 100, sampleRate: 16000, device: device(), app: "train-v1", input: "headset" };
  await qPutSafe({ cid, blob: take.blob, meta });
  st.done[p.id] = 1; save();
  advance(); flush(); showQueue();
}
function advance(){
  // go to the next phrase not yet recorded; if all done, show finish
  for (let k = 1; k <= PHRASES.length; k++) {
    const j = (idx + k) % PHRASES.length;
    if (!st.done[PHRASES[order[j]].id]) { idx = j; show(); return; }
  }
  finish();
}
function finish(){ $("main").classList.add("hidden"); $("done").classList.remove("hidden"); $("bar").style.width = "100%"; $("done-note").textContent = "Thank you. All " + PHRASES.length + " calls recorded. Keep the page open until the queue says all uploaded."; }

$("begin").addEventListener("click", async () => {
  if (!token()) { $("start-note").textContent = "No access token on this device. Open your personal link first."; return; }
  try { await ensureAudio(); } catch (e) { $("start-note").textContent = "Microphone not available (" + (e && e.name || e) + "). Allow the microphone for this site in Safari, then try again."; return; }
  $("start").style.display = "none"; $("main").classList.remove("hidden"); show();
});
$("rec").addEventListener("click", startRec);
$("stop").addEventListener("click", stopRec);
$("skip").addEventListener("click", () => { idx = (idx + 1) % PHRASES.length; show(); });
$("redo").addEventListener("click", () => { take = null; setView("ready"); setStatus("Tap Record, then read the call."); startRec(); });
$("next").addEventListener("click", keep);
$("again").addEventListener("click", () => { st.done = {}; st.pos = 0; idx = 0; save(); $("done").classList.add("hidden"); $("main").classList.remove("hidden"); show(); });
let player = null;
$("play").addEventListener("click", () => {
  if (!take) return;
  if (player) { player.pause(); URL.revokeObjectURL(player.src); }
  player = new Audio(URL.createObjectURL(take.blob)); player.play().catch(() => setStatus("Could not play. Turn the ringer on.", "bad"));
});
addEventListener("resize", fit);
$("count").textContent = (idx + 1) + " / " + PHRASES.length;
$("bar").style.width = (100 * Object.keys(st.done).length / PHRASES.length) + "%";
showQueue(); flush();
if (new Set(Object.keys(st.done)).size >= PHRASES.length) finish();
</script>
